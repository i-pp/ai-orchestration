name: Documentation CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - ".codex/agents/**"
      - "README.md"
      - "README_jp.md"
      - "docs/**"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/documentation-ci.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - ".codex/agents/**"
      - "README.md"
      - "README_jp.md"
      - "docs/**"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/documentation-ci.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Lint, build, and check local links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
      - name: Install locked documentation dependencies
        run: npm ci
        working-directory: docs
      - name: Lint documentation
        run: npm run docs:lint
        working-directory: docs
      - name: Build the prototype without publishing
        run: npm run docs:build
        working-directory: docs
      - name: Check repository-local Markdown links
        run: python3 scripts/check_markdown_links.py --exclude 'docs/ai/example/**'
