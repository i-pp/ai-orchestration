name: Editorial tools
on:
  pull_request:
    paths: ['skills/**', 'policies/editorial.md', '.github/workflows/editorial-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
      - run: python3 -B skills/article-editor/scripts/install_tools.py --install
      - run: python3 -B -m unittest discover -s skills/article-editor/scripts -p 'test_*.py' -v
