name: Editorial tools
on:
  pull_request:
    paths: ['skills/**', 'policies/editorial.md', '.github/workflows/editorial-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
      - run: python3 -B skills/article-editor/scripts/install_tools.py --install
      - run: python3 -B -m unittest discover -s skills/article-editor/scripts -p 'test_*.py' -v
